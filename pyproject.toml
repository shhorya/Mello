[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mello"
version = "0.1.0"
description = "Voice-first AI agent for early mental-distress check-ins and referral for India's informal workforce"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["scikit-learn>=1.3", "numpy>=1.24", "joblib>=1.3"]

[project.optional-dependencies]
speech = ["faster-whisper"]

[project.scripts]
mello-server = "mello.server:main"
mello-cli = "mello.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
